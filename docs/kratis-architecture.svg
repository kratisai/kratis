<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
    <defs>
        <!-- Arrow Markers -->
        <marker id="arr" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 1 1 L 7 4 L 1 7 z" fill="#58a6ff"/>
        </marker>
        <marker id="arr-green" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 1 1 L 7 4 L 1 7 z" fill="#3fb950"/>
        </marker>
        <marker id="arr-amber" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 1 1 L 7 4 L 1 7 z" fill="#d29922"/>
        </marker>
        <marker id="arr-purple" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 1 1 L 7 4 L 1 7 z" fill="#a371f7"/>
        </marker>
    </defs>

    <!-- 1. LEFT COLUMN: CLIENT + PERSISTENCE (x: 15 to 195) -->
    <!-- Developer UI -->
    <g>
        <rect x="15" y="15" width="180" height="135" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
        <rect x="15" y="15" width="180" height="24" rx="6" fill="#21262d"/>
        <text x="25" y="31" fill="#c9d1d9" font-size="11" font-weight="700">DEVELOPER UI</text>
        <text x="25" y="58" fill="#58a6ff" font-size="12" font-weight="600">Web &amp; Mobile Client</text>
        <text x="25" y="76" fill="#8b949e" font-size="10.5">• Chat &amp; Living Canvas</text>
        <text x="25" y="93" fill="#8b949e" font-size="10.5">• HITL Approval Prompts</text>
        <text x="25" y="110" fill="#8b949e" font-size="10.5">• Streaming Terminal Logs</text>
        <text x="25" y="127" fill="#8b949e" font-size="10.5">• Deep Wiki &amp; Code Graph</text>
    </g>

    <!-- Database -->
    <g>
        <rect x="15" y="175" width="180" height="140" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
        <rect x="15" y="175" width="180" height="24" rx="6" fill="#21262d"/>
        <text x="25" y="191" fill="#c9d1d9" font-size="11" font-weight="700">PERSISTENCE</text>
        <text x="25" y="218" fill="#d29922" font-size="12" font-weight="600">PostgreSQL + pgvector</text>
        <text x="25" y="236" fill="#8b949e" font-size="10.5">• AST Symbol Graph</text>
        <text x="25" y="253" fill="#8b949e" font-size="10.5">• Dependency &amp; Call Edges</text>
        <text x="25" y="270" fill="#8b949e" font-size="10.5">• Semantic HNSW Embeddings</text>
        <text x="25" y="287" fill="#8b949e" font-size="10.5">• Living Specs &amp; Task State</text>
        <text x="25" y="304" fill="#8b949e" font-size="10.5">• Multi-Tenant Virtual Keys</text>
    </g>

    <!-- 2. CENTER COLUMN: KRATIS ENGINE (x: 235 to 575, width: 340) -->
    <g>
        <rect x="235" y="15" width="340" height="300" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <rect x="235" y="15" width="340" height="26" rx="6" fill="#21183c"/>
        <text x="247" y="32" fill="#d2a8ff" font-size="11.5" font-weight="700" letter-spacing="0.5">KRATIS ENGINE (CONTROL PLANE)</text>

        <!-- Phase 1: Ingestion -->
        <rect x="247" y="49" width="316" height="74" rx="5" fill="#0d1117" stroke="#30363d"/>
        <text x="258" y="68" fill="#58a6ff" font-size="11.5" font-weight="600">1. Repository Intelligence &amp; Ingestion</text>
        <text x="258" y="85" fill="#8b949e" font-size="10.5">• Polyglot Tree-sitter AST extraction (60+ languages)</text>
        <text x="258" y="100" fill="#8b949e" font-size="10.5">• PageRank dimension discovery &amp; module clustering</text>
        <text x="258" y="115" fill="#8b949e" font-size="10.5">• Autonomous Deep Wiki synthesis &amp; vector indexing</text>

        <!-- Phase 2: Planning -->
        <rect x="247" y="131" width="316" height="74" rx="5" fill="#0d1117" stroke="#30363d"/>
        <text x="258" y="150" fill="#a371f7" font-size="11.5" font-weight="600">2. Planning Agent (Spring AI ReAct)</text>
        <text x="258" y="167" fill="#8b949e" font-size="10.5">• Deterministic Change-May-Impact blast radius analysis</text>
        <text x="258" y="182" fill="#8b949e" font-size="10.5">• Architecture pattern enforcement &amp; context grounding</text>
        <text x="258" y="197" fill="#8b949e" font-size="10.5">• Living Canvas: structured tasks &amp; acceptance criteria</text>

        <!-- Phase 3: Orchestration -->
        <rect x="247" y="213" width="316" height="88" rx="5" fill="#0d1117" stroke="#30363d"/>
        <text x="258" y="232" fill="#3fb950" font-size="11.5" font-weight="600">3. Sandbox Orchestration &amp; Security</text>
        <text x="258" y="249" fill="#8b949e" font-size="10.5">• Ephemeral Docker network &amp; container lifecycle</text>
        <text x="258" y="264" fill="#8b949e" font-size="10.5">• HITL gatekeeper (command &amp; file mutation approval)</text>
        <text x="258" y="279" fill="#8b949e" font-size="10.5">• Duplex streaming: /ws/client (UI) &amp; /ws/env (Sidecar)</text>
        <text x="258" y="294" fill="#8b949e" font-size="10.5">• Auto-reaping zombie sandbox containers</text>
    </g>

    <!-- 3. RIGHT COLUMN: SANDBOX & LLM (x: 615 to 925, width: 310) -->
    <!-- Sandbox -->
    <g>
        <rect x="615" y="15" width="310" height="210" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
        <rect x="615" y="15" width="310" height="26" rx="6" fill="#132a1c"/>
        <text x="627" y="32" fill="#56d364" font-size="11.5" font-weight="700" letter-spacing="0.5">ISOLATED SANDBOX (DOCKER)</text>

        <!-- Sidecar -->
        <rect x="627" y="49" width="286" height="42" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="637" y="66" fill="#f0f6fc" font-size="11" font-weight="600">Supervisor Sidecar (kratis-connector)</text>
        <text x="637" y="82" fill="#8b949e" font-size="10">Go daemon • JSON-RPC stdio mux • Credential helper</text>

        <!-- ACP Agent -->
        <rect x="627" y="105" width="286" height="52" rx="4" fill="#0d1117" stroke="#3fb950" stroke-dasharray="3 2"/>
        <text x="637" y="122" fill="#3fb950" font-size="11" font-weight="600">Pluggable ACP Coding Agent (UID 1000)</text>
        <text x="637" y="137" fill="#8b949e" font-size="10">Claude Code / OpenHands / Aider / Pi / Goose</text>
        <text x="637" y="150" fill="#8b949e" font-size="10">Executes tasks in /kratis/workspace • Pauses for HITL</text>

        <!-- Rootless DinD -->
        <rect x="627" y="169" width="286" height="44" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="637" y="186" fill="#c9d1d9" font-size="11" font-weight="600">Rootless DinD Sibling Container</text>
        <text x="637" y="202" fill="#8b949e" font-size="10">TCP 2375 • No host /var/run/docker.sock mount</text>
    </g>

    <!-- LLM Gateway -->
    <g>
        <rect x="615" y="235" width="310" height="80" rx="6" fill="#161b22" stroke="#e34c26" stroke-width="1.2"/>
        <rect x="615" y="235" width="310" height="22" rx="6" fill="#2d1715"/>
        <text x="627" y="250" fill="#ff7b72" font-size="10.5" font-weight="700">INFERENCE GATEWAY (LiteLLM)</text>
        <text x="627" y="274" fill="#f0f6fc" font-size="11" font-weight="600">Virtual Budget Keys &amp; Unified Proxy - any model</text>
        <text x="627" y="291" fill="#8b949e" font-size="10">• Anthropic • OpenAI • Gemini • Gwen</text>
        <text x="627" y="306" fill="#8b949e" font-size="10">• DeepSeek • Local Ollama / vLLM • etc.</text>
    </g>

    <!-- CONNECTING ARROWS -->
    <!-- UI <-> Control Plane -->
    <path d="M 195 75 L 235 75" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- Persistence <-> Control Plane -->
    <path d="M 195 245 L 235 245" stroke="#d29922" stroke-width="1.5" marker-end="url(#arr-amber)" marker-start="url(#arr-amber)"/>

    <!-- Control Plane <-> Sandbox Sidecar (ws/env) -->
    <path d="M 575 70 L 627 70" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)" marker-start="url(#arr-green)"/>

    <!-- Sidecar <-> ACP Agent (stdio) -->
    <path d="M 770 91 L 770 105" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arr-purple)" marker-start="url(#arr-purple)"/>

    <!-- ACP Agent -> DinD -->
    <path d="M 770 157 L 770 169" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Control Plane -> LiteLLM -->
    <path d="M 575 275 L 615 275" stroke="#e34c26" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>
</svg>
