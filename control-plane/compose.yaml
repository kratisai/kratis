# Development Docker Compose — used by spring-boot-docker-compose during `./mvnw spring-boot:run`.
# spring-boot-docker-compose runs `docker compose up` on every startup
# (spring.docker.compose.start.skip=NEVER in application.properties), so any stopped
# service here is restarted automatically. For production deployment, see deploy/compose.yaml.
name: kratis-dev

services:
  kratis-db:
    image: 'pgvector/pgvector:pg16'
    container_name: kratis-dev-postgres
    environment:
      - 'POSTGRES_DB=kratis'
      - 'POSTGRES_PASSWORD=kratis'
      - 'POSTGRES_USER=kratis'
    ports:
      - '5432:5432'
    volumes:
      # not ./data; the control-plane needs write, clashing with Docker directory creation
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kratis']
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    # Pinned by digest: `main-stable` is a moving tag. Refresh deliberately with
    #   docker buildx imagetools inspect ghcr.io/berriai/litellm:v<version> --format '{{.Manifest.Digest}}'
    image: 'ghcr.io/berriai/litellm:v1.102.0@sha256:32cfd7a427f6470033b4dcc9e75dfbea2aa32dbc298b0b511a40e962ce818362'
    container_name: kratis-dev-litellm
    environment:
      - 'LITELLM_MASTER_KEY=sk-litellm-master'
      - 'LITELLM_SALT_KEY=sk-litellm-salt'
      - 'LITELLM_LOG=INFO'
      - 'STORE_MODEL_IN_DB=True'
      - 'LITELLM_DROP_PARAMS=True'
      # Schema separation via the `?schema=` query param on DATABASE_URL — the DATABASE_SCHEMA
      # env var is unreliable when DATABASE_URL is also set (see BerriAI/litellm#15175).
      - 'DATABASE_URL=postgresql://kratis:kratis@kratis-db:5432/kratis?schema=litellm'
    ports:
      # 4001 (not 4000) so the dev stack can run alongside deploy/compose.yaml.
      - '${LITELLM_DEV_PORT:-4001}:4000'
    volumes:
      # Apply the one-shot fixes for the open LiteLLM spend-log bugs (BerriAI/litellm#29913 and
      # #28595/#28943) before the proxy starts — without them Responses-API traffic (Codex, Claude
      # Code) records zero usage. The script is idempotent and a no-op once an upstream release
      # contains the fixes.
      - ../deploy/litellm/patch_response_logging.py:/tmp/patch_response_logging.py:ro
      - ../deploy/litellm/healthcheck.py:/tmp/healthcheck.py:ro
    depends_on:
      kratis-db:
        condition: service_healthy
    healthcheck:
      # The litellm image is built on the "wolfi" distro, which has neither `curl` nor `wget`;
      # `python3` is the runtime the proxy itself runs on.
      test: ['CMD-SHELL', 'python3 /tmp/healthcheck.py']
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
    # Patch the module before litellm imports it (patching the .py file after launch has no effect),
    # then start the proxy. Replaces the image's default `docker/prod_entrypoint.sh` (which only
    # execs `litellm "$@"` when USE_DDTRACE is unset).
    entrypoint:
      [
        '/bin/sh',
        '-c',
        '/app/.venv/bin/python3 /tmp/patch_response_logging.py && exec /app/.venv/bin/litellm --port 4000',
      ]

  registry-cache:
    image: 'registry:2'
    container_name: kratis-dev-registry-cache
    restart: unless-stopped
    ports:
      # 5002 (not 5001) so the dev stack can run alongside deploy/compose.yaml.
      - '${REGISTRY_CACHE_DEV_PORT:-5002}:5000'
    environment:
      - 'REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io'
    volumes:
      - kratis-image-cache:/var/lib/registry

volumes:
  kratis-image-cache:
