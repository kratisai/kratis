# Global Initializer for Testcontainers PostgreSQL singleton
context.initializer.classes=com.kratisai.controlplane.PostgresTestInitializer

server.address=0.0.0.0

# Reduce Hikari pool size to prevent exhausting Testcontainers connections across many Spring Contexts
spring.datasource.hikari.maximum-pool-size=20

# JPA settings for tests
spring.jpa.hibernate.ddl-auto=validate

# Liquibase enabled for tests.PostgresTestInitializer.initialize() creates a schema per context
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog-master.yaml

# Default test schema — overridden per-context by PostgresTestInitializer via a context-local
# MapPropertySource. The override is what DatabaseCleaner and Hibernate actually use.
test.schema=public

# JWT Configuration for tests
kratis.auth.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hs256
kratis.auth.jwt.expiration=3600000
kratis.auth.jwt.refresh-expiration=604800000

# Parser Configuration
kratis.parser.binary-path=../build/bin/codebase-memory-mcp
kratis.parser.temp-dir=/tmp
kratis.parser.scc-binary-path=../build/bin/scc

# Sandbox runner image — the locally built/tagged image used by tests
kratis.sandbox.runner-image=kratis-runner-base:latest

# Security Configuration for tests
# Use a temporary key file for tests - EncryptionKeyManager will generate a key if it doesn't exist
kratis.security.key-file-path=${java.io.tmpdir}/kratis-test-encryption.key
kratis.security.allowed-origins=*
kratis.security.client-allowed-origins=*
kratis.security.env-allowed-origins=*

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Ingestion Configuration for tests
kratis.ingestion.max-concurrent=1

# GitHub App config for tests
kratis.github.app-id=123456
kratis.github.app-name=kratis-dummy-app
kratis.github.private-key-path=src/test/resources/test-keys/pkcs8.pem

kratis.websocket.buffer-size=5MB

# Small agent iteration budget so exhaustion is fast to trigger in integration tests.
kratis.agent.max-iterations=3

# Disable Zombie Container Collector during tests to prevent parallel Spring contexts from killing each other's containers
kratis.zombie-collector.enabled=false

# Disable usage telemetry during tests so scheduled heartbeats never contact PostHog.
# Telemetry tests override this to exercise the enabled path.
kratis.telemetry.disabled=true

# Instance identity: scopes sandbox container labels & ZombieContainerCollector
kratis.instance.id=kratis-test

# ---------------------------------------------------------------------------
# TEST CONTEXT STARTUP OPTIMISATIONS
# ---------------------------------------------------------------------------

# 1. Lazy bean initialisation: defer unused beans until first use.
#    Each test context only exercises a subset of beans; this avoids eagerly
#    initialising AI clients, REST templates, and other heavy singletons.
spring.main.lazy-initialization=true

# 2. Exclude Spring AI provider auto-configurations that are never used in
#    tests (FakeChatModelConfig/FakeEmbeddingModelFactory replace them all).
#    Each excluded provider would otherwise create HTTP clients, connection
#    pools, and credential-resolution chains on startup.
#    Class names verified against spring-ai-2.0.0-M6 jar manifests.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,\
  org.springframework.boot.autoconfigure.docker.compose.DockerComposeAutoConfiguration

# 3. Disable Springdoc/Swagger in tests — it scans all @RestController classes
#    to generate OpenAPI docs, which is pure startup overhead for test contexts.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 4. Disable LiteLLM startup reconciliation in tests — it is not needed on startup and takes HTTP time.
kratis.litellm.reconcile-on-startup=false

# 5. Short usage refresh debounce so execution_usage broadcasts arrive quickly in tests
#    without a per-test @TestPropertySource (which would fork a unique Spring context).
kratis.litellm.usage-refresh-interval=1s

# 6. Same final-fetch pause as production (3s). LiteLLM's async spend-log flush lands within this
#    window in the E2E scenario, where the agent's LLM calls all occur just before completion.
kratis.litellm.usage-finalize-delay=3s

# 7. The dev compose stack publishes its registry cache on 5002 (deploy uses 5001), so the default
#    would point at a closed port and every sandboxed image pull would bypass the cache.
kratis.sandbox.registry-mirror=${KRATIS_SANDBOX_REGISTRY_MIRROR:http://host.docker.internal:5002}

