databaseChangeLog:
- changeSet:
    id: 003-add-provider-model-base-model
    author: kratis
    changes:
    - addColumn:
        columns:
        - column:
            name: base_model
            type: VARCHAR(255)
        tableName: model_provider_models
- changeSet:
    id: 003-backfill-provider-model-base-model
    author: kratis
    changes:
    - sql:
        sql: UPDATE model_provider_models SET base_model = model_name WHERE base_model IS NULL
