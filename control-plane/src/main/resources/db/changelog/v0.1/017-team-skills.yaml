databaseChangeLog:
- changeSet:
    id: 017-team-skills-001
    author: kratis
    changes:
    - createTable:
        tableName: team_skill
        columns:
        - column:
            name: id
            type: UUID
            defaultValueComputed: gen_random_uuid()
            constraints:
              primaryKey: true
              primaryKeyName: pk_team_skill
              nullable: false
        - column:
            name: team_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: name
            type: VARCHAR(64)
            constraints:
              nullable: false
        - column:
            name: description
            type: VARCHAR(255)
            constraints:
              nullable: false
        - column:
            name: trigger_condition
            type: VARCHAR(512)
            constraints:
              nullable: false
        - column:
            name: blob_path
            type: VARCHAR(255)
            constraints:
              nullable: false
        - column:
            name: checksum_sha256
            type: VARCHAR(64)
            constraints:
              nullable: false
        - column:
            name: enabled
            type: BOOLEAN
            defaultValueBoolean: true
            constraints:
              nullable: false
        - column:
            name: created_at
            type: TIMESTAMP WITH TIME ZONE
            constraints:
              nullable: false
        - column:
            name: updated_at
            type: TIMESTAMP WITH TIME ZONE
            constraints:
              nullable: false
    - addForeignKeyConstraint:
        baseTableName: team_skill
        baseColumnNames: team_id
        constraintName: fk_team_skill_team
        referencedTableName: teams
        referencedColumnNames: id
        onDelete: CASCADE
    - addUniqueConstraint:
        tableName: team_skill
        columnNames: team_id, name
        constraintName: uk_team_skill_name
    - createIndex:
        tableName: team_skill
        indexName: idx_team_skill_team
        columns:
        - column:
            name: team_id
