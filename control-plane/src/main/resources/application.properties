spring.application.name=kratis
spring.threads.virtual.enabled=true

# Spring Boot's default (IF_RUNNING) skips even when a container is
# in the process of shutting down
spring.docker.compose.start.skip=NEVER
# Dev stack: start if needed, keep running across app restarts.
# Inert in prod/native — as the runtime image ships no compose.yaml.
spring.docker.compose.lifecycle-management=start-only

# PostgreSQL Connection — auto-configured by spring-boot-docker-compose
# When running with Docker Compose, these are overridden by the container
spring.datasource.url=jdbc:postgresql://localhost:5432/kratis
spring.datasource.username=kratis
spring.datasource.password=kratis
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog-master.yaml

# use logstash-logback-encoder json logs for PROD
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr([%logger{20}]){cyan} - %msg%n
logging.exception-conversion-word=%wEx{full, sun.reflect, java.lang.reflect, java.util.concurrent, org.junit, org.apache.maven, org.springframework.aop, org.springframework.transaction, org.springframework.security, org.mockito, net.bytebuddy}
logging.level.root=WARN
logging.level.com.kratisai=DEBUG
logging.level.com.kratisai.controlplane.service.ZombieContainerCollector=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# JWT Configuration (placeholder for Step 2)
# Note: Default value is for development only. Use a 256-bit (32+ char) secret in production.
kratis.auth.jwt.secret=${JWT_SECRET:change-me-in-production-this-must-be-at-least-32-chars}
kratis.auth.jwt.expiration=1h
kratis.auth.jwt.refresh-expiration=7d

# Kratis Configuration
kratis.planning.max-iterations=50

# Chat title auto-generation (one-shot, non-thinking LLM call)
kratis.titles.min-words=5
kratis.titles.max-words=15
kratis.titles.max-messages=10

# Instance identity: scopes sandbox container labels & the zombie collector
kratis.instance.id=${KRATIS_INSTANCE_ID:default}
kratis.instance.hostname=${KRATIS_HOSTNAME:}

# Sandbox execution
# URL advertised to user-run connectors (the kratis-connector command shown in the UI).
kratis.sandbox.connect-url=${KRATIS_SANDBOX_CONNECT_URL:ws://localhost:8080/ws/env}
# Local-Docker provider plumbing. connect-url is the address injected into spawned containers,
# which reach this control plane through the host gateway rather than localhost.
kratis.sandbox.docker.connect-url=${KRATIS_SANDBOX_DOCKER_CONNECT_URL:ws://host.docker.internal:8080/ws/env}
kratis.sandbox.docker.registry-mirror=${KRATIS_SANDBOX_DOCKER_REGISTRY_MIRROR:http://host.docker.internal:5001}
kratis.sandbox.docker.runner-image=${KRATIS_SANDBOX_DOCKER_RUNNER_IMAGE:kratis-runner-base:latest}
kratis.sandbox.docker.debug=${KRATIS_SANDBOX_DOCKER_DEBUG:false}
# Lifecycle: auto-suspend idle sandboxes, then terminate long-unused suspend snapshots.
kratis.sandbox.lifecycle.sleep.enabled=true
kratis.sandbox.lifecycle.sleep.poll-interval=60s
kratis.sandbox.lifecycle.sleep.idle-timeout=20m
kratis.sandbox.lifecycle.retention.enabled=true
kratis.sandbox.lifecycle.retention.poll-interval=1d
kratis.sandbox.lifecycle.retention.period=30d
# Reconciliation: reap orphaned or delinquent sandboxes and dangling networks.
kratis.sandbox.reconciliation.enabled=true
kratis.sandbox.reconciliation.poll-interval=10s
kratis.sandbox.reconciliation.grace-period=30s
kratis.harnesses.directory=${KRATIS_HARNESSES_DIRECTORY:harnesses}

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.api-docs.version=OPENAPI_3_0
# Kratis is a Java application, so springdoc's Kotlin support is unnecessary. Its
# Kotlin reflective customizers call RecordComponent.getAccessor, which native-image
# strips, failing every /api-docs request with NoSuchMethodError.
springdoc.enable-kotlin=false

# Parser Configuration
kratis.parser.binary-path=../build/bin/codebase-memory-mcp
kratis.parser.temp-dir=/tmp
kratis.parser.scc-binary-path=${KRATIS_SCC_BINARY_PATH:../build/bin/scc}

# Ingestion Configuration
# Maximum number of concurrent repository ingestions
kratis.ingestion.max-concurrent=2
# Root for per-batch git clones used by read_file, cloning, parsing, and wiki generation.
kratis.ingestion.clone-dir=${KRATIS_INGESTION_CLONE_DIR:${java.io.tmpdir}/kratis-ingest}

# Dimension Research Configuration
kratis.ingestion.dimension-research.max-concurrency=25
kratis.ingestion.dimension-research.max-retries=3
kratis.ingestion.dimension-research.initial-backoff-ms=1000
kratis.ingestion.dimension-research.max-backoff-ms=5000

# Security Configuration
# Path to the encryption key file. If the file doesn't exist, a random key will be generated and persisted.
kratis.security.key-file-path=${KRATIS_KEY_FILE_PATH:./data/encryption.key}

# Security & Origin Filtering
# Comma-separated list of allowed origins or '*' for local development
kratis.security.allowed-origins=${KRATIS_ALLOWED_ORIGINS:*}
kratis.security.client-allowed-origins=${KRATIS_CLIENT_ALLOWED_ORIGINS:${kratis.security.allowed-origins}}
kratis.security.env-allowed-origins=${KRATIS_ENV_ALLOWED_ORIGINS:*}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# GitHub App — DISABLED unless all values provided at runtime
kratis.github.app-id=${KRATIS_GITHUB_APP_ID:}
kratis.github.app-name=${KRATIS_GITHUB_APP_NAME:}
kratis.github.private-key-path=${KRATIS_GITHUB_PRIVATE_KEY_PATH:}

# LiteLLM Gateway Configuration
# base-url is the host-side URL used by the control plane. sandbox-base-url is
# the URL injected into sandbox containers, which reach the host via the
# host.docker.internal gateway (see LocalDockerSandboxProvider spawnSandbox).
# Override both in application-<profile>.properties for other environments.
kratis.litellm.base-url=${KRATIS_LITELLM_BASE_URL:http://localhost:4000}
kratis.litellm.master-key=${KRATIS_LITELLM_MASTER_KEY:sk-litellm-master}
kratis.litellm.sandbox-base-url=${KRATIS_LITELLM_SANDBOX_BASE_URL:${KRATIS_LITELLM_BASE_URL:http://host.docker.internal:4000}}
kratis.litellm.usage-refresh-interval=${KRATIS_LITELLM_USAGE_REFRESH_INTERVAL:15s}
kratis.litellm.usage-finalize-delay=${KRATIS_LITELLM_USAGE_FINALIZE_DELAY:3s}
kratis.litellm.connect-timeout=${KRATIS_LITELLM_CONNECT_TIMEOUT:5s}
kratis.litellm.read-timeout=${KRATIS_LITELLM_READ_TIMEOUT:30s}
kratis.litellm.reconciliation.enabled=${KRATIS_LITELLM_RECONCILIATION_ENABLED:true}
kratis.litellm.reconciliation.retry-interval=${KRATIS_LITELLM_RECONCILIATION_RETRY_INTERVAL:10s}

# Parallel pool for the usage debounce fires and other scheduled tasks
spring.task.scheduling.pool.size=4

# Anonymous usage telemetry (PostHog). Enabled by default; set KRATIS_TELEMETRY_DISABLED=1
# or DO_NOT_TRACK=1 to skip ALL PostHog calls. Both flags have the same effect.
kratis.telemetry.disabled=${KRATIS_TELEMETRY_DISABLED:false}
kratis.telemetry.do-not-track=${DO_NOT_TRACK:false}
kratis.telemetry.version=${KRATIS_VERSION:unknown}
kratis.telemetry.build-tag=${KRATIS_BUILD_TAG:unknown}
kratis.telemetry.endpoint=https://eu.i.posthog.com/capture/
kratis.telemetry.initial-delay=60s
kratis.telemetry.fixed-delay=1d
kratis.telemetry.http-timeout=10s

# Pluggable Blob Storage
kratis.storage.type=${KRATIS_STORAGE_TYPE:local}
kratis.storage.local-path=${KRATIS_STORAGE_LOCAL_PATH:./data/blobs}
