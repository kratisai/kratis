$schema: https://json-schema.org/draft/2020-12/schema
title: CancelAgentResult
type: object
required:
- status
- exitCode
properties:
  status:
    type: string
    enum:
    - "completed"
    - "cancelled"
  exitCode:
    type: integer
  error:
    type:
    - string
    - "null"
additionalProperties: false
