openrpc: 1.3.2
info:
  title: Kratis Environment WebSocket Protocol
  version: 1.0.0
  description: Bidirectional JSON-RPC 2.0 protocol between Kratis Control Plane and Sidecar Connector
methods:
- name: env.register
  summary: Register sidecar environment session with control plane
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/register.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/register.schema.yaml
- name: env.heartbeat
  summary: Periodic sidecar heartbeat
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: request
  params: []
  result:
    name: result
    schema:
      $ref: ./schemas/results/heartbeat.schema.yaml
- name: env.git_token
  summary: Fetch a fresh git credential token from the control plane
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: request
  params: []
  result:
    name: result
    schema:
      $ref: ./schemas/results/git_token.schema.yaml
- name: env.output
  summary: Stream execution stdout/stderr line
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/output.schema.yaml
- name: env.activity
  summary: Stream execution activity event
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/activity.schema.yaml
- name: env.sidecar_error
  summary: Report a connector-side failure (unexpected close, dropped frame) to the control plane
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/sidecar_error.schema.yaml
- name: env.diff_manifest
  summary: Submit a git diff manifest with per-file SHA hashes and check for missing sections
  description: The sidecar sends the manifest containing all changed files and their section SHAs. The control plane returns whether it is already committed or incomplete with a list of missing section SHAs.
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/diff_manifest.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/diff_manifest.schema.yaml
- name: env.diff_sections
  summary: Upload missing diff file section parts and receive updated missing status
  description: The sidecar uploads parts of missing file sections. When all parts for a section arrive, it is reassembled and verified against the expected SHA.
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/diff_sections.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/diff_sections.schema.yaml
- name: env.complete
  summary: Signal command execution completion
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/complete.schema.yaml
- name: env.checkout_complete
  summary: Signal git checkout completion
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/checkout_complete.schema.yaml
- name: env.acp_initialized
  summary: Signal ACP agent initialization
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/acp_initialized.schema.yaml
- name: env.acp_prompt_complete
  summary: Signal ACP task completion
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/acp_prompt_complete.schema.yaml
- name: env.hitl_activity
  summary: Request authorization or human answer for an activity
  x-kratis-direction: connector-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/hitl_activity.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/hitl_activity.schema.yaml
- name: env.exec
  summary: Execute a shell command in the sidecar workspace
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/exec.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/exec.schema.yaml
- name: env.registerGitAuth
  summary: Register git credentials in sidecar
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/register_git_auth.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/register_git_auth.schema.yaml
- name: env.registerGitIdentity
  summary: Persist the git author identity in the sandbox
  description: Registers the git author identity independently of credentials. The connector persists it to the container's global git config so it survives connector restarts and applies to every git invocation.
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/register_git_identity.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/register_git_identity.schema.yaml
- name: env.checkout
  summary: Dispatch git repository checkout to sidecar; completion arrives via env.checkout_complete
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: notification
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/checkout.schema.yaml
- name: env.launch_acp_agent
  summary: Launch ACP harness agent in sidecar
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/launch_acp_agent.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/launch_acp_agent.schema.yaml
- name: env.acp_prompt
  summary: Send task prompt to running ACP agent
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/acp_prompt.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/acp_prompt.schema.yaml
- name: env.terminate
  summary: Terminate running environment execution
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params: []
  result:
    name: result
    schema:
      $ref: ./schemas/results/terminate.schema.yaml
- name: env.git_diff_summary
  summary: Retrieve git diff summary manifest for working tree / commits
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: false
    schema:
      $ref: ./schemas/requests/git_diff_summary.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/git_diff_summary.schema.yaml
- name: env.read_file_slice
  summary: Read slice of lines from a workspace file for hunk expansion
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/read_file_slice.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/read_file_slice.schema.yaml
- name: env.get_logs
  summary: Read the trailing lines of the sandbox terminal log for console catch-up
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/get_logs.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/get_logs.schema.yaml
- name: env.git_push
  summary: Stage, commit, and push branch to remote origin
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/git_push.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/git_push.schema.yaml
- name: env.git_set_remote
  summary: Configure origin and seed the default branch of a newly created remote repository
  x-kratis-direction: control-plane-to-connector
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/git_set_remote.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/git_set_remote.schema.yaml
