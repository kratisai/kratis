openrpc: 1.3.2
info:
  title: Kratis Client WebSocket Protocol
  version: 1.1.0
  description: Bidirectional JSON-RPC 2.0 protocol between Control Plane and Web UI Client. Request results are correlated by id; server-push payloads (x-kratis-notifications) use the same result envelope with id=null.
methods:
- name: auth
  summary: Authenticate WebSocket connection
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/auth.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/auth.schema.yaml
- name: ping
  summary: Client keepalive ping
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  params: []
  result:
    name: result
    schema:
      $ref: ./schemas/results/ping.schema.yaml
- name: subscribe
  summary: Subscribe to team event updates
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/subscribe.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/subscription.schema.yaml
- name: unsubscribe
  summary: Unsubscribe from team event updates
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/subscribe.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/subscription.schema.yaml
- name: chat.send
  summary: Send chat prompt message; result is a stream of chat payloads correlated with the request id
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  x-kratis-streaming: true
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/chat_send.schema.yaml
  result:
    name: result
    schema:
      oneOf:
      - $ref: ./schemas/results/message_chunk.schema.yaml
      - $ref: ./schemas/results/telemetry.schema.yaml
      - $ref: ./schemas/results/complete.schema.yaml
      - $ref: ./schemas/results/chat_error.schema.yaml
      - $ref: ./schemas/results/canvas.schema.yaml
      - $ref: ./schemas/results/planning_status.schema.yaml
- name: chat.subscribe
  summary: Subscribe to chat; result replays history then streams live payloads, correlated with the request id
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  x-kratis-streaming: true
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/chat_subscribe.schema.yaml
  result:
    name: result
    schema:
      oneOf:
      - $ref: ./schemas/results/message.schema.yaml
      - $ref: ./schemas/results/message_chunk.schema.yaml
      - $ref: ./schemas/results/telemetry.schema.yaml
      - $ref: ./schemas/results/complete.schema.yaml
      - $ref: ./schemas/results/chat_error.schema.yaml
      - $ref: ./schemas/results/canvas.schema.yaml
      - $ref: ./schemas/results/planning_status.schema.yaml
- name: chat.unsubscribe
  summary: Unsubscribe from chat updates
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/chat_unsubscribe.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/chat_subscription.schema.yaml
- name: chat.continue
  summary: Continue paused planning agent; result is a stream of chat payloads correlated with the request id
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  x-kratis-streaming: true
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/chat_continue.schema.yaml
  result:
    name: result
    schema:
      oneOf:
      - $ref: ./schemas/results/message_chunk.schema.yaml
      - $ref: ./schemas/results/telemetry.schema.yaml
      - $ref: ./schemas/results/complete.schema.yaml
      - $ref: ./schemas/results/chat_error.schema.yaml
      - $ref: ./schemas/results/canvas.schema.yaml
      - $ref: ./schemas/results/planning_status.schema.yaml
- name: execution.subscribe
  summary: Subscribe to an execution; replays persisted activities then streams execution events, correlated with the request id
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  x-kratis-streaming: true
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/execution_subscribe.schema.yaml
  result:
    name: result
    schema:
      oneOf:
      - $ref: ./schemas/results/execution_activity.schema.yaml
      - $ref: ./schemas/results/execution_subscription.schema.yaml
- name: execution.unsubscribe
  summary: Unsubscribe from execution updates
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/execution_unsubscribe.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/execution_subscription.schema.yaml
- name: execution.get_logs
  summary: Fetch the trailing terminal log lines for an execution's environment; the reply goes only to the requesting session
  x-kratis-direction: web-to-control-plane
  x-kratis-message-kind: request
  params:
  - name: params
    required: true
    schema:
      $ref: ./schemas/requests/execution_get_logs.schema.yaml
  result:
    name: result
    schema:
      $ref: ./schemas/results/execution_logs.schema.yaml
x-kratis-notifications:
- name: team_entity_changed
  summary: Team-scoped entity update pushed to team subscribers
  schema:
    $ref: ./schemas/results/team_entity_changed.schema.yaml
- name: user_entity_changed
  summary: User-scoped entity update pushed to the owning user's sessions
  schema:
    $ref: ./schemas/results/user_entity_changed.schema.yaml
- name: execution_output
  summary: Streamed stdout/stderr line from an execution
  schema:
    $ref: ./schemas/results/execution_output.schema.yaml
- name: execution_complete
  summary: Execution lifecycle completion signal
  schema:
    $ref: ./schemas/results/execution_complete.schema.yaml
- name: execution_status_changed
  summary: Execution status or usage change for a chat's executions; receivers invalidate the chat execution list
  schema:
    $ref: ./schemas/results/execution_status_changed.schema.yaml
- name: execution_activity
  summary: Agent activity event from an execution
  schema:
    $ref: ./schemas/results/execution_activity.schema.yaml
- name: execution_acp_initialized
  summary: ACP handshake completed for an execution (sessionId, agent name/version)
  schema:
    $ref: ./schemas/results/execution_acp_initialized.schema.yaml
- name: ingestion
  summary: Repository ingestion status update
  schema:
    $ref: ./schemas/results/ingestion.schema.yaml
- name: execution_diff_changed
  summary: Workspace diff changed for an execution; receivers invalidate diff queries
  schema:
    $ref: ./schemas/results/execution_diff_changed.schema.yaml
