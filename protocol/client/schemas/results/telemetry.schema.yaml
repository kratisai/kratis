$schema: "https://json-schema.org/draft/2020-12/schema"
title: TelemetryResult
type: object
required:
- type
- chatId
- attempt
- event
properties:
  type:
    type: string
    const: telemetry
    enum:
    - telemetry
  chatId:
    type: string
    format: uuid
  attempt:
    type: integer
    minimum: 1
    description: "One-based sequence of the LLM call that produced this telemetry within the current turn. Events from a retracted attempt must be discarded."
  event:
    anyOf:
    - $ref: "#/$defs/Thought"
    - $ref: "#/$defs/ToolStart"
    - $ref: "#/$defs/ToolStatus"
    - $ref: "#/$defs/ToolError"
additionalProperties: false

$defs:
  Thought:
    type: object
    required:
    - text
    properties:
      text:
        type: string
    additionalProperties: false

  ToolStart:
    type: object
    required:
    - taskId
    - toolName
    - thought
    properties:
      taskId:
        type: string
      toolName:
        type: string
      thought:
        type: string
    additionalProperties: false

  ToolStatus:
    type: object
    required:
    - taskId
    - status
    properties:
      taskId:
        type: string
      status:
        type: string
    additionalProperties: false

  ToolError:
    type: object
    required:
    - taskId
    - error
    properties:
      taskId:
        type: string
      error:
        type: string
    additionalProperties: false