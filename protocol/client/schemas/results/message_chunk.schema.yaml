$schema: https://json-schema.org/draft/2020-12/schema
title: MessageChunkResult
type: object
required:
- type
- content
- chatId
- messageId
- role
- attempt
- timestamp
properties:
  type:
    type: string
    const: "message_chunk"
    enum:
    - "message_chunk"
  content:
    type: string
  chatId:
    type: string
    format: uuid
  messageId:
    type: string
  role:
    type: string
    enum:
    - "user"
    - "assistant"
    - "system"
    - "tool"
  attempt:
    type: integer
    minimum: 1
    description: "One-based sequence of the LLM call that produced this chunk within the current turn. Chunks from a retracted attempt must be discarded."
  timestamp:
    type: string
additionalProperties: true
