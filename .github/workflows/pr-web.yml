name: Web CI (PR)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/pr-web.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Formatting
        run: npm run format:check

      - name: Lint Code
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Tests with Coverage
        run: npm run coverage

      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        # Fork PRs get a read-only GITHUB_TOKEN and cannot comment; skip the report for them.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with:
          json-summary-path: './web/coverage/coverage-summary.json'
          json-final-path: './web/coverage/coverage-final.json'
          vite-config-path: './web/vite.config.ts'
