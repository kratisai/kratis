name: Build and Publish Runner Base

on:
  push:
    branches: [ "main" ]
    paths:
      - 'build/Dockerfile.runner-base'
      - '.github/workflows/build-runner-base.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'build/Dockerfile.runner-base'
      - '.github/workflows/build-runner-base.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-runner-base:
    if: github.repository == 'kratisai/kratis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Owner to Lowercase
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/kratis-runner-base" >> $GITHUB_OUTPUT

      - name: Build and Push Runner Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.runner-base
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.prep.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
