name: Build and Publish Runner Base

on:
  push:
    branches: [ "main" ]
    paths:
      - 'build/Dockerfile.runner-base'
      - '.github/workflows/build-runner-base.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Per-arch builds merged into one multi-arch `:latest` by the `merge` job, so agent sandboxes
  # boot on amd64 and arm64 hosts (including Apple Silicon) without emulation.
  build:
    name: Build runner-base (${{ matrix.arch }})
    if: github.repository == 'kratisai/kratis'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Owner to Lowercase
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/kratis-runner-base" >> $GITHUB_OUTPUT

      - name: Build and Push Runner Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.runner-base
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.prep.outputs.image_name }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=runner-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runner-base-${{ matrix.arch }}

  merge:
    needs: build
    if: github.repository == 'kratisai/kratis'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Owner to Lowercase
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/kratis-runner-base" >> $GITHUB_OUTPUT

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.prep.outputs.image_name }}:latest" \
            "${{ steps.prep.outputs.image_name }}:latest-amd64" \
            "${{ steps.prep.outputs.image_name }}:latest-arm64"
