name: Main Release (Build & Publish)

on:
  # Automated on Git version tags (e.g. v1.0.0, v2.1.3-beta.1)
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom image tag (defaults to branch/SHA if left empty)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: kratis-nativebuild-runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kratis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.control-plane
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NATIVE_PARALLELISM=${{ vars.NATIVE_PARALLELISM || '8' }}
            NATIVE_HEAP=${{ vars.NATIVE_HEAP || '24g' }}
            VERSION=${{ steps.meta.outputs.version || inputs.custom_tag || 'dev' }}
            BUILD_TAG=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Deploy Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy/
          retention-days: 5