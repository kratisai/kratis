name: Main Release (Build & Publish)

on:
  # Automated on Git version tags (e.g. v1.0.0, v2.1.3-beta.1)
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom image tag (defaults to branch/SHA if left empty)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: kratis-nativebuild-runner
          - arch: arm64
            runner: kratis-nativebuild-runner-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kratis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}
            type=sha,prefix=sha-

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.control-plane
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/kratis:smoke-${{ github.run_id }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NATIVE_PARALLELISM=${{ vars.NATIVE_PARALLELISM || '8' }}
            NATIVE_HEAP=${{ vars.NATIVE_HEAP || '24g' }}
            VERSION=${{ steps.meta.outputs.version || inputs.custom_tag || 'dev' }}
            BUILD_TAG=sha-${{ github.sha }}
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}

      # Gate the publish on a real boot: the harness catalogue and Liquibase only run at startup,
      # so a successful image build does not prove the image works.
      - name: Smoke test the built image
        run: ./build/smoke-test-image.sh "ghcr.io/${{ github.repository_owner }}/kratis:smoke-${{ github.run_id }}-${{ matrix.arch }}"

      - name: Push smoke-tested image
        run: docker push "ghcr.io/${{ github.repository_owner }}/kratis:smoke-${{ github.run_id }}-${{ matrix.arch }}"

  # Merges the two smoke-tested images into one multi-arch manifest for every release tag, so
  # `docker pull` selects the right architecture on x64 Linux, arm64 Linux, and Apple Silicon.
  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kratis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}
            type=sha,prefix=sha-

      - name: Create multi-arch release tags
        run: |
          docker buildx imagetools create \
            $(printf -- '-t %s ' ${{ steps.meta.outputs.tags }}) \
            "ghcr.io/${{ github.repository_owner }}/kratis:smoke-${{ github.run_id }}-amd64" \
            "ghcr.io/${{ github.repository_owner }}/kratis:smoke-${{ github.run_id }}-arm64"

      - name: Upload Deploy Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy/
          retention-days: 5
